<body>
    <header>
        <img src="GameIcon.svg" alt="">
        
        <h1>Tournaments</h1><br>
        @if (this.authService.isLoggedIn()) {
            <a routerLink="/profile" class="Registation-login">profile</a>
        } @else {
            <a routerLink="/auth" class="Registation-login">Registration/Login</a>
        }
        
       
        
    </header>
    <div class="main-content">
        <section class="nav-side">
            <div class="main-page">
                <img src="GameIcon.svg" alt=""><h2>Tournaments List</h2>
            </div>
            @for (tournament of tournamentIds; track $index) {
                <div class="tournament-card">
                    <span>{{$index}} tournament</span>
                </div>
            }
        </section>
        <section class="table-side">
            
        </section>
    </div>
    <footer>
        @if (this.authService.isLoggedIn()) {
            <button (click)="logout()">Logout</button>
        } @else {
            
        }
        
    </footer>
    
</body>
